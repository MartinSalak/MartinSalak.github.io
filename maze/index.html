<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maze</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #grid {
            width: 320px; /* 16 x 20px squares */
            height: 320px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(16, 20px);
            grid-template-rows: repeat(16, 20px);
            gap: 2px;
        }

        .cell {
            width: 20px;
            height: 20px;
            background: #ddd;
        }

        .wall {
            background: #444;
        }

        .goal {
            background: limegreen;
        }

        .active {
            background: orange;
        }

        .visited {
            background: black;
        }
    </style>
    <!-- Brython -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython_stdlib.js"></script>
</head>
<body onload="brython()">
    <h1>Maze</h1>
    <div id="grid"></div>
    <script type="text/python" src="maze.py"></script>
</body>
</html>
